global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prepai-alerts.yml

scrape_configs:
  - job_name: prepai-api
    metrics_path: /metrics
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/prepai-metrics-token
    static_configs:
      - targets:
          - server:3000
        labels:
          service: prepai-api
